<html>
    <head>
        <title>App Meuble</title>
        <meta name="viewport" content="viewport-fit=cover, width=device-width, height=device-height, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no">
        <link href="main.css" rel="stylesheet">
    </head>
    <body>
        <div id="main">
            Bonjour
            <div id="FormMeModule1" class="FormMeModule">
                <div>
                    <label>Largeur:</label>
                    <input type="number" class="InputNumber largeur">
                </div>
                <div>
                    <label>Hauteur:</label>
                    <input type="number" class="InputNumber hauteur">
                </div>
                <div>
                    <label>Profondeur:</label>
                    <input type="number" class="InputNumber profondeur">
                </div>
                <div>
                    <label>Couleur:</label>
                    <input type="color" class="couleur">
                </div>
                <div>
                    <label>Volume:</label>
                    <input type="number" readonly class="volume">
                </div>
                <div>
                    <button class="btnOk">OK</button>
                    <button class="btnCancel">Cancel</button>
                </div>
            </div>
            <div id="FormMeModule2" class="FormMeModule">
            </div>
            <br><br>
            <div id="DrawMeModule1" class="DrawModule"></div>
        </div>
        <script type="module" src="index.js"></script>
    </body>
</html>
